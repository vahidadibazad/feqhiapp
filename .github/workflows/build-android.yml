name: Build and Release Android APK

on:
  push:
    branches:
      - my-branding
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build and Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install dependencies
        run: |
          npm ci
          npm install -g cordova@12.0.0 ionic cordova-res

      - name: Patch Cordova CLI for Node 24
        run: |
          CORDOVA_JS="$(npm root -g)/cordova/bin/cordova"
          echo "Patching: $CORDOVA_JS"
          sed -i "s|process\.exitCode = err\.code|process.exitCode = 1|g" "$CORDOVA_JS"
          sed -i "s|process\.exitCode = error\.code|process.exitCode = 1|g" "$CORDOVA_JS"

      - name: Generate app icons and splash
        run: |
          cordova-res android --skip-config --copy || echo "cordova-res skipped"

      - name: Build Ionic app
        run: |
          npm run build

      - name: Clean platforms directory
        run: |
          rm -rf platforms android plugins/android.json
          echo "Cleaned"

      - name: Add Android platform
        run: |
          cordova platform add cordova-android@12.0.0 --nosave

      - name: Ensure cdv_strings.xml exists
        run: |
          VALUES_DIR="platforms/android/app/src/main/res/values"
          mkdir -p "$VALUES_DIR"
          if [ ! -f "$VALUES_DIR/cdv_strings.xml" ]; then
            echo "Creating cdv_strings.xml manually..."
            printf "<?xml version='1.0' encoding='utf-8'?>\n<resources>\n</resources>\n" > "$VALUES_DIR/cdv_strings.xml"
          fi
          echo "=== cdv_strings.xml ==="
          cat "$VALUES_DIR/cdv_strings.xml"

      - name: Prepare Cordova platform
        run: |
          cordova prepare android --verbose

      - name: Verify platform structure
        run: |
          echo "=== platform list ==="
          cordova platform list
          echo "=== values dir ==="
          ls -la platforms/android/app/src/main/res/values/

      - name: Build APK (Debug)
        run: |
          cordova build android --debug --no-telemetry

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: platforms/android/app/build/outputs/apk/debug/*.apk
          name: FeqhiApp v${{ steps.version.outputs.version }} (Build ${{ github.run_number }})
          tag_name: v${{ steps.version.outputs.version }}-build${{ github.run_number }}
          body: |
            ## نسخه جدید فقهی‌اپ
            - نسخه: ${{ steps.version.outputs.version }}
            - شماره ساخت: ${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}