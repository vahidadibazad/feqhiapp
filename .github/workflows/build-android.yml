name: Build and Release Android APK

on:
  push:
    branches:
      - my-branding
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build and Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install dependencies
        run: |
          npm ci
          npm install -g cordova@12.0.0 ionic cordova-res

      - name: Patch Cordova CLI for Node 24
        run: |
          CORDOVA_JS="$(npm root -g)/cordova/bin/cordova"
          echo "Patching file: $CORDOVA_JS"
          if [ ! -f "$CORDOVA_JS" ]; then
            echo "ERROR: Cordova bin file not found!"
            find / -name "cordova" -path "*/bin/cordova" 2>/dev/null | head -5
            exit 1
          fi
          echo "--- BEFORE ---"
          grep -n "exitCode" "$CORDOVA_JS"
          sed -i "s|process\.exitCode = err\.code|process.exitCode = 1|g" "$CORDOVA_JS"
          sed -i "s|process\.exitCode = error\.code|process.exitCode = 1|g" "$CORDOVA_JS"
          echo "--- AFTER ---"
          grep -n "exitCode" "$CORDOVA_JS"

      - name: Generate app icons and splash
        run: |
          cordova-res android --skip-config --copy || echo "cordova-res skipped"

      - name: Build Ionic app
        run: |
          npm run build

      - name: Add Android platform
        run: |
          cordova platform add cordova-android@13.0.0 --nosave

      - name: Build APK (Debug)
        run: |
          cordova build android --debug --no-telemetry

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: platforms/android/app/build/outputs/apk/debug/*.apk
          name: FeqhiApp v${{ steps.version.outputs.version }} (Build ${{ github.run_number }})
          tag_name: v${{ steps.version.outputs.version }}-build${{ github.run_number }}
          body: |
            ## نسخه جدید فقهی‌اپ
            - نسخه: ${{ steps.version.outputs.version }}
            - شماره ساخت: ${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}