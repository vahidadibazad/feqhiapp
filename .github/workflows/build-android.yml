name: Build and Release Android APK

on:
  push:
    branches:
      - my-branding
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build and Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install dependencies
        run: |
          npm ci
          npm install -g cordova ionic

      - name: Build Ionic app
        run: |
          npm run build
          echo "=== Contents of www/ ==="
          ls -la www/
          echo "=== Checking cordova.js ==="
          ls -la www/cordova.js || echo "cordova.js NOT FOUND"
          echo "=== Checking env.json ==="
          cat www/assets/env.json | head -40
          echo "=== Checking lang files ==="
          ls -la www/assets/lang/ || echo "lang folder missing"

      - name: Force change default_lang to en
        run: |
          sed -i 's/"default_lang": "fa"/"default_lang": "en"/' www/assets/env.json
          sed -i 's/"forcedefaultlanguage": true/"forcedefaultlanguage": false/' www/assets/env.json
          echo "=== Updated env.json ==="
          head -15 www/assets/env.json

      - name: Add Android platform
        run: |
          npx cordova platform add android

      - name: Verify cordova.js in platform
        run: |
          ls -la platforms/android/app/src/main/assets/www/cordova.js || echo "cordova.js missing in platform"
          ls -la platforms/android/app/src/main/assets/www/assets/lang/ || echo "lang folder missing in platform"

      - name: Build APK (Debug)
        run: |
          npx cordova build android --debug --no-telemetry

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: platforms/android/app/build/outputs/apk/debug/*.apk
          name: FeqhiApp v${{ steps.version.outputs.version }} (Build ${{ github.run_number }})
          tag_name: v${{ steps.version.outputs.version }}-build${{ github.run_number }}
          body: |
            ## نسخه جدید فقهی‌اپ
            - نسخه: ${{ steps.version.outputs.version }}
            - شماره ساخت: ${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}