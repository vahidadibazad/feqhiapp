name: Build and Release Android APK

on:
  push:
    branches:
      - my-branding
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build and Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install dependencies
        run: |
          npm ci
          npm install -g cordova@12.0.0 ionic cordova-res

      - name: Patch Cordova CLI for Node 24
        run: |
          CORDOVA_JS="$(npm root -g)/cordova/bin/cordova"
          sed -i "s|process\.exitCode = err\.code|process.exitCode = 1|g" "$CORDOVA_JS"
          sed -i "s|process\.exitCode = error\.code|process.exitCode = 1|g" "$CORDOVA_JS"

      - name: Generate app icons and splash
        run: |
          cordova-res android --skip-config --copy || echo "cordova-res skipped"

      - name: Build Ionic app
        run: |
          npm run build

      - name: Clean platforms directory
        run: |
          rm -rf platforms android plugins/android.json

      - name: Add Android platform
        run: |
          cordova platform add cordova-android@13.0.0 --nosave

      - name: Create Cordova resource XML files
        run: |
          VALUES_DIR="platforms/android/app/src/main/res/values"
          DRAWABLE_DIR="platforms/android/app/src/main/res/drawable"
          mkdir -p "$VALUES_DIR" "$DRAWABLE_DIR"

          # cdv_strings.xml
          cat > /tmp/cdv_strings.xml << 'XML_EOF'
          <?xml version='1.0' encoding='utf-8'?>
          <resources>
              <string name="app_name">فقهی‌اپ</string>
              <string name="launch_activity">MainActivity</string>
              <string name="menu_settings">Settings</string>
              <string name="cdv_battery_usage">Battery usage</string>
              <string name="cdv_battery_open_settings">Open Settings</string>
              <string name="cdv_battery_ok">OK</string>
              <string name="cdv_battery_cancel">Cancel</string>
          </resources>
          XML_EOF
          sed -i 's/^          //' /tmp/cdv_strings.xml
          cp /tmp/cdv_strings.xml "$VALUES_DIR/cdv_strings.xml"

          # cdv_colors.xml
          cat > /tmp/cdv_colors.xml << 'XML_EOF'
          <?xml version='1.0' encoding='utf-8'?>
          <resources>
              <color name="cdv_splashscreen_background">#FFFFFF</color>
          </resources>
          XML_EOF
          sed -i 's/^          //' /tmp/cdv_colors.xml
          cp /tmp/cdv_colors.xml "$VALUES_DIR/cdv_colors.xml"

          # cdv_themes.xml with all required items
          cat > /tmp/cdv_themes.xml << 'XML_EOF'
          <?xml version='1.0' encoding='utf-8'?>
          <resources>
              <style name="Theme.App.SplashScreen" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="windowSplashScreenBackground">@color/cdv_splashscreen_background</item>
                  <item name="windowSplashScreenAnimatedIcon">@drawable/splash_placeholder</item>
                  <item name="postSplashScreenTheme">@style/Theme.AppCompat.Light.NoActionBar</item>
                  <item name="android:windowSplashScreenBackground">@color/cdv_splashscreen_background</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/splash_placeholder</item>
              </style>
          </resources>
          XML_EOF
          sed -i 's/^          //' /tmp/cdv_themes.xml
          cp /tmp/cdv_themes.xml "$VALUES_DIR/cdv_themes.xml"

          # Placeholder drawable for splash
          cat > /tmp/splash_placeholder.xml << 'XML_EOF'
          <?xml version='1.0' encoding='utf-8'?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#FFFFFF"/>
          </shape>
          XML_EOF
          sed -i 's/^          //' /tmp/splash_placeholder.xml
          cp /tmp/splash_placeholder.xml "$DRAWABLE_DIR/splash_placeholder.xml"

          echo "=== Created files ==="
          ls -la "$VALUES_DIR"
          ls -la "$DRAWABLE_DIR"
          echo "=== cdv_themes.xml ==="
          cat "$VALUES_DIR/cdv_themes.xml"

      - name: Prepare Cordova platform
        run: |
          cordova prepare android --verbose

      - name: Build APK (Debug)
        run: |
          cordova build android --debug --no-telemetry

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: platforms/android/app/build/outputs/apk/debug/*.apk
          name: FeqhiApp v${{ steps.version.outputs.version }} (Build ${{ github.run_number }})
          tag_name: v${{ steps.version.outputs.version }}-build${{ github.run_number }}
          body: |
            ## نسخه جدید فقهی‌اپ
            - نسخه: ${{ steps.version.outputs.version }}
            - شماره ساخت: ${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}