name: Build and Release Android APK

on:
  push:
    branches:
      - my-branding
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build and Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install dependencies
        run: |
          npm ci
          npm install -g cordova ionic

      - name: Verify customized files exist
        run: |
          echo "=== src/assets/env.json ==="
          head -20 src/assets/env.json
          echo "=== src/assets/lang/ ==="
          ls -la src/assets/lang/
          test -f src/assets/env.json || (echo "ERROR: src/assets/env.json missing!" && exit 1)
          test -f src/assets/lang/fa.json || (echo "WARNING: src/assets/lang/fa.json missing!")

      - name: Build Ionic app
        run: |
          npm run build
          echo "=== Top level of www/ ==="
          ls -la www/ | head -20

      - name: Override env.json with customized values (CRITICAL)
        run: |
          node -e "
            const fs = require('fs');
            const env = JSON.parse(fs.readFileSync('src/assets/env.json', 'utf8'));
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            env.build = {
              version: pkg.version,
              isProduction: false,
              isTesting: false,
              isDevelopment: true,
              lastCommitHash: process.env.GITHUB_SHA || 'local',
              compilationTime: Date.now()
            };
            fs.writeFileSync('www/assets/env.json', JSON.stringify(env));
            console.log('=== Overridden env.json ===');
            console.log('app_id:', env.config.app_id);
            console.log('appname:', env.config.appname);
            console.log('sites:', JSON.stringify(env.config.sites));
            console.log('onlyallowlistedsites:', env.config.onlyallowlistedsites);
          "
          echo "=== Verify override ==="
          grep -o '\"app_id\":\"[^\"]*\"' www/assets/env.json

      - name: Ensure lang files are present
        run: |
          mkdir -p www/assets/lang
          cp -v src/assets/lang/*.json www/assets/lang/ 2>/dev/null || true
          echo "=== lang files in www ==="
          ls -la www/assets/lang/

      - name: Add Android platform
        run: |
          npx cordova platform add android

      - name: Verify overrides survived in platform
        run: |
          echo "=== env.json app_id in platform ==="
          grep -o '\"app_id\":\"[^\"]*\"' platforms/android/app/src/main/assets/www/assets/env.json
          echo "=== lang files in platform ==="
          ls -la platforms/android/app/src/main/assets/www/assets/lang/

      - name: Build APK (Debug)
        run: |
          npx cordova build android --debug --no-telemetry

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: platforms/android/app/build/outputs/apk/debug/*.apk
          name: FeqhiApp v${{ steps.version.outputs.version }} (Build ${{ github.run_number }})
          tag_name: v${{ steps.version.outputs.version }}-build${{ github.run_number }}
          body: |
            ## نسخه جدید فقهی‌اپ
            - نسخه: ${{ steps.version.outputs.version }}
            - شماره ساخت: ${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}